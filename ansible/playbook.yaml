---
- name: Deploy AnomalyX to EC2
  hosts: anomalyx
  become: yes
  vars_files:
    - group_vars/all/vault.yml

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Docker dependencies
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - python3-pip
        state: present

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes
    - name: Clone AnomalyX repository
      git:
        repo: "https://github.com/ridhima-2412/satellite-anomaly-detector.git"
        dest: /home/ubuntu/anomalyx
        version: Main
        force: yes

    - name: Create .env file from vault values
      copy:
        content: |
          DB_URL={{ vault_db_url }}
          BACKEND_URL={{ vault_backend_url }}
        dest: /home/ubuntu/anomalyx/.env

    - name: Run docker compose up
      command: docker compose up --build -d
      args:
        chdir: /home/ubuntu/anomalyx
